name: Deploy til TEST via SFTP
on:
  push:
    branches:
      - test
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v4
      # Bare app/ publiseres — prototyper, tester og regler blir igjen i repoet.
      - name: Last opp app/ med SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './app/*'
          remote_path: '/customers/7/7/8/chd71y6vo/webroots/r1057943/Soknadsportal-test'
          sftp_only: true
      # «app/*» tar ikke med punktum-filer, så .htaccess lastes opp for seg.
      - name: Last opp .htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './app/.htaccess'
          remote_path: '/customers/7/7/8/chd71y6vo/webroots/r1057943/Soknadsportal-test'
          sftp_only: true
