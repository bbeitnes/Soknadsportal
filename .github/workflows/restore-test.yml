name: Restore-test
# Legger nyeste sikkerhetskopi fra ProISP i databasen soknadsportal-restore og
# kontrollerer antall dokumenter og filer (OPPSETT.md §9). Nøkkelen kan bare
# skrive til restore-målet (B-25). Kjører 1. hver måned, og når du trykker
# «Run workflow». Etterpå: http://localhost:8430/?restore
on:
  schedule:
    - cron: '43 3 1 * *'
  workflow_dispatch:
concurrency: sikkerhetskopi
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backup
    steps:
      - name: Hent koden
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backup/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Legg nyeste kopi i soknadsportal-restore og kontroller
        env:
          GOOGLE_NOKKEL_JSON: ${{ secrets.RESTORE_GOOGLE_NOKKEL }}
          KOPI_PASSORD: ${{ secrets.KOPI_PASSORD }}
          KOPI_SFTP_MAPPE: ${{ secrets.KOPI_SFTP_MAPPE }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: node gjenopprett.mjs
